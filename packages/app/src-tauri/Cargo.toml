[package]
name = "cutting-board"
version = "0.1.0"
description = "A macOS menu-bar whiteboard for quick diagrams, sticky notes, and annotations."
authors = ["Utensils"]
license = "MIT"
repository = "https://github.com/utensils/cutting-board"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The library is consumed by `main.rs` (desktop) and the mobile entry point.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3" }
tauri-plugin-log = "2"

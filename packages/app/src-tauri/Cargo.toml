[package]
name = "cutting-board"
version = "0.1.0"
description = "A macOS menu-bar whiteboard for quick diagrams, sticky notes, and annotations."
authors = ["Utensils"]
license = "MIT"
repository = "https://github.com/utensils/cutting-board"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The library is consumed by `main.rs` (desktop) and the mobile entry point.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4"
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "time", "macros"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
rand = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSImage"] }
